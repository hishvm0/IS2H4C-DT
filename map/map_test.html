<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Animate a line</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<style>
    button {
        position: absolute;
        margin: 20px;
    }

    #pause::after {
        content: 'Pause';
    }

    #pause.pause::after {
        content: 'Play';
    }
</style>
  <script id="nodes-data" type="application/json">__NODES__</script>
  <script id="edges-data" type="application/json">__EDGES__</script>

<div id="map"></div>
<button id="pause"></button>
<script>

    mapboxgl.accessToken = 'pk.eyJ1IjoiaGlzaGFtYWZhc2giLCJhIjoiY21mM3NrcGRlMDAweTJrczNyZzJhdWNyNSJ9.E_YstJ3rUCf1TtkF7_jjoQ';

    // Parse the embedded GeoJSON
    const points = JSON.parse(document.getElementById('nodes-data').textContent);
    const edges = JSON.parse(document.getElementById('edges-data').textContent);

    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        center: [6.642, 52.374],
        zoom: 14.5,
        pitch: 60,
        bearing: -20,
        antialias: true,
        style: 'mapbox://styles/hishamafash/cmff3hyi6005701r94w439k4z'
    });



    map.on('load', () => {
        // ------- ADD DATA SOURCES -------
        if (!map.getSource('nodes')) {
        map.addSource('nodes', {
          type: 'geojson',
          data: points
        });
      } else {
        map.getSource('nodes').setData(points);
      }

        if (!map.getSource('edges')) {
        map.addSource('edges', {
          type: 'geojson',
          data: edges
        });
    } else {
        map.getSource('edges').setData(edges);
    }

        // -------- ADD LAYERS --------
        map.addLayer({
            'id': 'nodes',
            'type': 'circle',
            'source': 'nodes',
            'paint': {
                'circle-radius': 4,
                'circle-color': '#007cbf'
            }
        });

        map.addLayer({
            'id': 'edges-background',
            'type': 'line',
            'source': 'edges',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': 'yellow',
                'line-width': 2,
                'line-opacity': 0.3
            }
        });

        map.addLayer({
            'id': 'edges-foreground',
            'type': 'line',
            'source': 'edges',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': '#ff0000',
                'line-width': 4,
                'line-dasharray': [0, 2, 4],
                'line-emissive-strength': 1
            }
        });
// --- Listen for messages to update the map without reloading ---
window.addEventListener('message', (event) => {
  // Optional: restrict origins for security (replace with your Streamlit origin)
  // if (event.origin !== 'http://localhost:8501') return;

  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;

  // Update edges
  if (msg.type === 'reloadEdges' && msg.data) {
    try {
      const newEdges = (typeof msg.data === 'string') ? JSON.parse(msg.data) : msg.data;
      const src = map.getSource('edges');
      if (src) src.setData(newEdges);
    } catch (e) {
      console.error('Failed to parse edges payload', e);
    }
  }

  // Update nodes
  if (msg.type === 'reloadNodes' && msg.data) {
    try {
      const newNodes = (typeof msg.data === 'string') ? JSON.parse(msg.data) : msg.data;
      const src = map.getSource('nodes');
      if (src) src.setData(newNodes);
    } catch (e) {
      console.error('Failed to parse nodes payload', e);
    }
  }
});

        // --- Hover tooltip for edges ---
        const popup = new mapboxgl.Popup({
          closeButton: false,
          closeOnClick: false
        });

        // change cursor when hovering lines
        map.on('mouseenter', 'edges-foreground', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'edges-foreground', () => {
          map.getCanvas().style.cursor = '';
          popup.remove();
        });

        // show tooltip following the mouse
        map.on('mousemove', 'edges-foreground', (e) => {
          const f = e.features && e.features[0];
          if (!f) return;
          const content =
            f.properties.tooltip ||
            `${f.properties.flow_type || ''}: ${f.properties.from_id || ''} → ${f.properties.to_id || ''}`;
          popup.setLngLat(e.lngLat).setHTML(content).addTo(map);
        });




        // ------- ANIMATE THE DASHED LINE -------

        // technique based on https://jsfiddle.net/2mws8y3q/
        // an array of valid line-dasharray values, specifying the lengths of the alternating dashes and gaps that form the dash pattern
        const dashArraySequence = [
            [0, 4, 3],
            [0.5, 4, 2.5],
            [1, 4, 2],
            [1.5, 4, 1.5],
            [2, 4, 1],
            [2.5, 4, 0.5],
            [3, 4, 0],
            [0, 0.5, 3, 3.5],
            [0, 1, 3, 3],
            [0, 1.5, 3, 2.5],
            [0, 2, 3, 2],
            [0, 2.5, 3, 1.5],
            [0, 3, 3, 1],
            [0, 3.5, 3, 0.5]
        ];

        let step = 0;

        function animateDashArray(timestamp) {
            // Update line-dasharray using the next value in dashArraySequence. The
            // divisor in the expression `timestamp / 50` controls the animation speed.
            const newStep = parseInt(
                (timestamp / 50) % dashArraySequence.length
            );

            if (newStep !== step) {
                map.setPaintProperty(
                    'edges-foreground',
                    'line-dasharray',
                    dashArraySequence[step]
                );
                step = newStep;
            }

            // Request the next frame of the animation.
            requestAnimationFrame(animateDashArray);


            // --- Pause/Play control ---
            const btn = document.getElementById('pause');
            let paused = false;
            let rafId = null;

            btn.addEventListener('click', () => {
              paused = !paused;
              btn.classList.toggle('pause', paused); // swaps label via CSS
              if (!paused) {
                // resume
                rafId = requestAnimationFrame(animateDashArray);
              } else if (rafId) {
                // pause
                cancelAnimationFrame(rafId);
                rafId = null;
              }
            });

            // update animate function according to pause button
            function animateDashArray(timestamp) {
              if (paused) return; // do nothing while paused

              const newStep = parseInt((timestamp / 50) % dashArraySequence.length);
              if (newStep !== step) {
                map.setPaintProperty('edges-foreground', 'line-dasharray', dashArraySequence[step]);
                step = newStep;
              }

              rafId = requestAnimationFrame(animateDashArray);
            }
        }

        // start the animation
        animateDashArray(0);
    
    });
</script>
<!-- dynamic info label -->
<div id="energyLabel"
     style="position:absolute;top:10px;right:10px;
            background:rgba(0,0,0,0.6);color:white;
            padding:6px 10px;border-radius:6px;
            font-size:14px;">
  Source: __ENERGY_SOURCE__
</div>

</body>
</html>
