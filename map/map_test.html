<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Animate a line</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<style>
    button {
        position: absolute;
        margin: 20px;
    }

    #pause::after {
        content: 'Pause';
    }

    #pause.pause::after {
        content: 'Play';
    }
</style>
    <script id="nodes-data" type="application/json">__NODES__</script>
    <script id="edges-data" type="application/json">__EDGES__</script>
    <script id="pipe-data" type="application/json">__PIPELINE__</script>


<div id="map"></div>
<button id="pause"></button>
<script>

    mapboxgl.accessToken = 'pk.eyJ1IjoiY3lnbnVzMjYiLCJhIjoiY2s5Z2MzeWVvMGx3NTNtbzRnbGtsOXl6biJ9.8SLdJuFQzuN-s4OlHbwzLg';

    // Parse the embedded GeoJSON
    const points = JSON.parse(document.getElementById('nodes-data').textContent);
    const edges = JSON.parse(document.getElementById('edges-data').textContent);
    const pipeline = JSON.parse(document.getElementById('pipe-data').textContent);


    const map = new mapboxgl.Map({
        container: 'map',
        // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
        center: [6.644, 52.366],
        zoom: 15.5,
        pitch: 60,
        bearing: -20,
        antialias: true,
        style: 'mapbox://styles/cygnus26/cmh0rq554001y01sc2i2z9i6k'
    });



    map.on('load', () => {
        // ------- ADD DATA SOURCES -------
        if (!map.getSource('nodes')) {
        map.addSource('nodes', {
          type: 'geojson',
          data: points
        });
      } else {
        map.getSource('nodes').setData(points);
      }

        if (!map.getSource('edges')) {
        map.addSource('edges', {
          type: 'geojson',
          data: edges
        });
    } else {
        map.getSource('edges').setData(edges);
    }

    // -------- ADD ICONS --------
        map.loadImage(
            'https://img.icons8.com/3d-fluency/94/location.png',
            (error, image) => {
                if (error) throw error;
                map.addImage('node-icon', image);
            }
        );

        // -------- ADD LAYERS --------
      map.addLayer({
            'id': 'edges-background',
            'type': 'line',
            'source': 'edges',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': 'white',
                'line-width': ['get', 'value'],
                'line-opacity': 0.6
            }
        });

        map.addLayer({
            'id': 'edges-foreground',
            'type': 'line',
            'source': 'edges',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': ['get', 'color'],
                'line-width': ['get', 'value'],
                'line-dasharray': [0, 2, 4],
                'line-emissive-strength': 1.5
            }
        });
        // --- O2 overlay (parallel offset) ---
        map.addLayer({
          id: 'edges-O2-fg-offset',
          type: 'line',
          source: 'edges',
          filter: ['==', ['get','flow_type'], 'O2'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': ['get','color'],
            'line-width': ['coalesce', ['to-number', ['get','value']], 2],
            'line-dasharray': [0, 2, 4],
            'line-emissive-strength': 1.5,
            'line-offset': 12   // big enough to SEE the separation; tune later
          }
        });

        // --- H2O overlay (parallel offset) ---
        map.addLayer({
          id: 'edges-H2O-fg-offset',
          type: 'line',
          source: 'edges',
          filter: ['==', ['get','flow_type'], 'H2O'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': ['get','color'],
            'line-width': ['coalesce', ['to-number', ['get','value']], 2],
            'line-dasharray': [0, 2, 4],
            'line-emissive-strength': 1.5,
            'line-offset': -10
          }
        });
        // --- O2 halo under the offset layer ---
        map.addLayer({
          id: 'edges-O2-bg-offset',
          type: 'line',
          source: 'edges',
          filter: ['==', ['get','flow_type'], 'O2'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': 'white',
            'line-width': ['coalesce', ['to-number', ['get','value']], 2],
            'line-opacity': 0.6,
            'line-offset': 10
          }
        }, 'edges-O2-fg-offset'); // insert below the foreground

        // --- H2O halo under the offset layer ---
        map.addLayer({
          id: 'edges-H2O-bg-offset',
          type: 'line',
          source: 'edges',
          filter: ['==', ['get','flow_type'], 'H2O'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': 'white',
            'line-width': ['coalesce', ['to-number', ['get','value']], 2],
            'line-opacity': 0.6,
            'line-offset': -12
          }
        }, 'edges-H2O-fg-offset')

        // --- Pipeline source  ---
        if (!map.getSource('elec_houses')) {
          map.addSource('elec_houses', {
            type: 'geojson',
            data: pipeline   // FeatureCollection or LineString from your geojson.io file
          });
        } else {
          map.getSource('elec_houses').setData(pipeline);
        }

        map.addLayer({
          id: 'elec_houses',
          type: 'line',
          source: 'elec_houses',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': '#39FF14',
            'line-width':  [
              'interpolate', ['linear'],
              ['coalesce', ['to-number', ['get', 'value']], 0],
              0,     2,   // 0 kg/yr → 2 px
              1000,  3,
              3000,  6,
              6000, 10,
              10000,12
            ],
            'line-opacity': 1,
            'line-dasharray': [0, 2, 4],
            'line-emissive-strength': 1.5,   // optional glow on dark maps
          }
        });


        // --- Hover tooltip for the pipeline ---
        const pipePopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

        map.on('mouseenter', 'elec_houses', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'elec_houses', () => {
          map.getCanvas().style.cursor = '';
          pipePopup.remove();
        });

        map.on('mousemove', 'elec_houses', (e) => {
          const f = e.features && e.features[0];
          if (!f) return;

          // Use a property if your geojson has one (e.g., name/medium/type), else fallback text
          const label =
            f.properties?.name ||
            f.properties?.type ||
            "Hydrogen pipeline to residential units";

          pipePopup.setLngLat(e.lngLat).setHTML(label).addTo(map);
        });

          map.addLayer({
            'id': 'nodes',
            'type': 'symbol',
            'source': 'nodes',
            'layout': {
                'icon-image': 'node-icon',
                'icon-size': 0.3,
                'icon-allow-overlap': true
            }
        });

        // --- Hover tooltip for NODES (houses, etc.) ---
        const nodePopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

        map.on('mouseenter', 'nodes', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'nodes', () => {
          map.getCanvas().style.cursor = '';
          nodePopup.remove();
        });
        map.on('mousemove', 'nodes', (e) => {
          const f = e.features && e.features[0];
          if (!f) return;
          const html =
            f.properties?.tooltip ||
            `Name: ${f.properties?.name || f.properties?.id || 'Node'}`;
          nodePopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
        });


// --- Listen for messages to update the map without reloading ---
window.addEventListener('message', (event) => {
  // Optional: restrict origins for security (replace with your Streamlit origin)
  // if (event.origin !== 'http://localhost:8501') return;

  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;

  // Update edges
  if (msg.type === 'reloadEdges' && msg.data) {
    try {
      const newEdges = (typeof msg.data === 'string') ? JSON.parse(msg.data) : msg.data;
      const src = map.getSource('edges');
      if (src) src.setData(newEdges);
    } catch (e) {
      console.error('Failed to parse edges payload', e);
    }
  }

  // Update nodes
  if (msg.type === 'reloadNodes' && msg.data) {
    try {
      const newNodes = (typeof msg.data === 'string') ? JSON.parse(msg.data) : msg.data;
      const src = map.getSource('nodes');
      if (src) src.setData(newNodes);
    } catch (e) {
      console.error('Failed to parse nodes payload', e);
    }
  }
});
        // --- Hover tooltip for edges (includes O2 & H2O) ---
 const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

        ['edges-foreground', 'edges-O2-fg-offset', 'edges-H2O-fg-offset'].forEach(layerId => {
          map.on('mouseenter', layerId, () => {
            map.getCanvas().style.cursor = 'pointer';
          });

          map.on('mouseleave', layerId, () => {
            map.getCanvas().style.cursor = '';
            popup.remove();
          });

          map.on('mousemove', layerId, (e) => {
            const f = e.features && e.features[0];
            if (!f) return;
            const content =
              f.properties.tooltip ||
              `${f.properties.flow_type || ''}: ${f.properties.from_id || ''} → ${f.properties.to_id || ''}`;
            popup.setLngLat(e.lngLat).setHTML(content).addTo(map);
          });
        });


        // ------- HOVER TOOLTIP FOR NODES -------
        map.on('mouseenter', 'nodes', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'nodes', () => {
          map.getCanvas().style.cursor = '';
          popupNode.remove();
        });

        map.on('mousemove', 'nodes', (e) => {
          const f = e.features && e.features[0];
          if (!f) return;
          const content =
            f.properties.tooltip ||
            `Name: ${f.properties.name || ''}`;
          popupNode.setLngLat(e.lngLat).setHTML(content).addTo(map);
        });


        // ------- ANIMATE THE DASHED LINE -------

        // technique based on https://jsfiddle.net/2mws8y3q/
        // an array of valid line-dasharray values, specifying the lengths of the alternating dashes and gaps that form the dash pattern
        const dashArraySequence = [
            [0, 4, 3],
            [0.5, 4, 2.5],
            [1, 4, 2],
            [1.5, 4, 1.5],
            [2, 4, 1],
            [2.5, 4, 0.5],
            [3, 4, 0],
            [0, 0.5, 3, 3.5],
            [0, 1, 3, 3],
            [0, 1.5, 3, 2.5],
            [0, 2, 3, 2],
            [0, 2.5, 3, 1.5],
            [0, 3, 3, 1],
            [0, 3.5, 3, 0.5]
        ];

        let step = 0;
        let paused = false;
        let rafId = null;

function animateDashArray(timestamp) {
  if (paused) return;

  const newStep = parseInt((timestamp / 50) % dashArraySequence.length);
  if (newStep !== step) {
    const pattern = dashArraySequence[newStep];

            // Update ALL flow layers if present
        if (map.getLayer('edges-foreground')) {
          map.setPaintProperty('edges-foreground', 'line-dasharray', pattern);
        }
        if (map.getLayer('edges-O2-fg-offset')) {
          map.setPaintProperty('edges-O2-fg-offset', 'line-dasharray', pattern);
        }
        if (map.getLayer('edges-H2O-fg-offset')) {
          map.setPaintProperty('edges-H2O-fg-offset', 'line-dasharray', pattern);
        }
        if (map.getLayer('elec_houses')) {
          map.setPaintProperty('elec_houses', 'line-dasharray', pattern);
        }
    step = newStep;
  }
  rafId = requestAnimationFrame(animateDashArray);
}

// Pause/Play control (single, global)
const btn = document.getElementById('pause');
btn.addEventListener('click', () => {
  paused = !paused;
  btn.classList.toggle('pause', paused); // CSS flips label Play/Pause
  if (!paused) {
    if (!rafId) rafId = requestAnimationFrame(animateDashArray);
  } else if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
});

// Start animation initially
rafId = requestAnimationFrame(animateDashArray);

    
    });
</script>
<!-- dynamic info label -->
<div id="energyLabel"
     style="position:absolute;top:10px;right:10px;
            background:rgba(0,0,0,0.6);color:white;
            padding:6px 10px;border-radius:6px;
            font-size:14px;">
  Source: __ENERGY_SOURCE__
</div>

</body>
</html>
